name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # A real S3-compatible server so the S3 backend's integration tests run
      # in CI rather than being skipped. The credentials are MinIO's local
      # defaults for this throwaway container, not secrets.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing local/simple-drive-test"

      - name: Start an FTP server
        run: |
          docker run -d --name ftp -p 2121:21 -p 21000-21010:21000-21010 \
            -e USERS="drive|drivepass|/ftp/drive" -e ADDRESS=localhost -e MIN_PORT=21000 -e MAX_PORT=21010 \
            delfer/alpine-ftp-server:latest

      - name: Run tests
        env:
          RAILS_ENV: test
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_BUCKET: simple-drive-test
          S3_TEST_ACCESS_KEY_ID: minioadmin
          S3_TEST_SECRET_ACCESS_KEY: minioadmin
          FTP_TEST_HOST: localhost
          FTP_TEST_PORT: "2121"
          FTP_TEST_USERNAME: drive
          FTP_TEST_PASSWORD: drivepass
        run: bin/rails db:test:prepare test
