# Local S3-compatible storage for development and for the S3 integration
# tests: `docker compose up -d`. The credentials below are MinIO's well-known
# defaults for a throwaway local container, not secrets; the matching
# application settings are listed in .env.example and the README.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 10

  create-buckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/simple-drive
      && mc mb --ignore-existing local/simple-drive-test"

  # FTP server for the optional FTP backend and its integration tests; the
  # account is as throwaway as the MinIO one. The image has no version tags, so
  # it is pinned by digest. Its start script backgrounds vsftpd and races to
  # find the PID, which kills the container on some starts, so vsftpd runs in
  # the foreground instead. The script still creates the account from USERS
  # first, and the -o overrides must follow the config file, which would
  # otherwise reset them.
  ftp:
    image: delfer/alpine-ftp-server@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac
    command: >
      vsftpd /etc/vsftpd/vsftpd.conf -obackground=NO
      -opasv_min_port=21000 -opasv_max_port=21010 -opasv_address=127.0.0.1
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21000-21010:21000-21010"
    environment:
      USERS: "drive|drivepass|/ftp/drive"

volumes:
  minio-data:
